name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pio test -e native

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: cyd
            budget: 3145728 # huge_app.csv app partition
          - env: esp32-38pin
            budget: 3145728 # huge_app.csv app partition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pio run -e ${{ matrix.env }}
      - name: Size gate
        env:
          FLASH_BUDGET: ${{ matrix.budget }} # bytes; app partition size for this env
        run: |
          size=$(stat -c %s .pio/build/${{ matrix.env }}/firmware.bin)
          echo "firmware.bin: $size bytes (budget $FLASH_BUDGET)"
          test "$size" -le "$FLASH_BUDGET"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
