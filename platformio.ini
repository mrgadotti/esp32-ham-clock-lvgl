; ESP32 ham clock (LVGL 9). TFT_eSPI is configured only through build_flags.

[platformio]
default_envs = cyd

[env]
lib_deps = bblanchon/ArduinoJson@^7

[esp32_base]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_unflags = -Os
extra_scripts = pre:tools/gen_web.py
lib_deps =
	${env.lib_deps}
	lvgl/lvgl@9.6.0
	bodmer/TFT_eSPI@2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
	-O2
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_INVERSION_ON=1
	-DLOAD_GLCD=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DUSE_HSPI_PORT=1
	-DLV_CONF_INCLUDE_SIMPLE=1
	-I include

[env:cyd]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	-DBOARD_CYD=1

; Screen-test harness build (serial screenshots + synthetic touch); never the default env.
[env:cyd_test]
extends = esp32_base
monitor_speed = 921600
build_flags =
	${esp32_base.build_flags}
	-DBOARD_CYD=1
	-DSCREEN_TEST=1
	-DSCREEN_TEST_BAUD=921600

[env:esp32-38pin]
extends = esp32_base
build_flags =
	${esp32_base.build_flags}
	-DBOARD_38PIN=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
